<!DOCTYPE html>
<html>
<head>
    <title>Ntu Television - Admin</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="mode-switch">
        <a href="index.html" class="switch-btn">🔁 Switch to Viewer</a>
    </div>
    <div class="container">
        <h1>📺 Ntu Television Admin</h1>
        <video id="localVideo" autoplay muted playsinline></video>
        <button id="startBtn">Start Broadcast</button>
        <button id="stopBtn" style="display:none; background:#ff4444;">Stop Broadcast</button>
        <div id="status"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });
        
        let localStream = null;
        let peerConnections = {};
        let isBroadcasting = false;

        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');

        const configuration = { 
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
        };

        // Handle socket connection errors
        socket.on('connect_error', (err) => {
            console.error('❌ Socket connection error:', err);
            statusDiv.textContent = 'Server connection failed. Retrying...';
        });

        socket.on('disconnect', () => {
            console.warn('⚠️ Disconnected from server');
            statusDiv.textContent = 'Disconnected from server';
        });

        startBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = 'Requesting camera access...';
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: true 
                });
                
                localVideo.srcObject = localStream;
                isBroadcasting = true;
                
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                statusDiv.textContent = 'Camera active. Waiting for viewers...';
                
                socket.emit('admin-ready');
                console.log('📡 Admin ready signal sent');
            } catch (err) {
                console.error('❌ Camera error:', err);
                statusDiv.textContent = 'Error accessing camera: ' + err.message;
                if (err.name === 'NotAllowedError') {
                    statusDiv.textContent += ' (Please allow camera permissions)';
                }
            }
        });

        stopBtn.addEventListener('click', () => {
            endBroadcast();
        });

        function endBroadcast() {
            isBroadcasting = false;
            
            // Stop all tracks to release camera
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    track.stop();
                    console.log('🛑 Stopped track:', track.kind);
                });
                localStream = null;
            }
            
            // Close all peer connections
            Object.keys(peerConnections).forEach(id => {
                peerConnections[id].close();
                delete peerConnections[id];
            });
            
            localVideo.srcObject = null;
            socket.emit('broadcast-ended');
            
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            statusDiv.textContent = 'Broadcast ended';
            console.log('📴 Broadcast ended by admin');
        }

        socket.on('new-viewer', (viewerId) => {
            if (!isBroadcasting || !localStream) {
                console.warn(`⚠️ Viewer ${viewerId} tried to connect but broadcast not active`);
                return;
            }
            
            statusDiv.textContent = `New viewer ${viewerId} connected. Creating offer...`;
            console.log(`👤 New viewer: ${viewerId}`);
            createPeerConnection(viewerId);
        });

        async function createPeerConnection(viewerId) {
            // Close existing connection if any
            if (peerConnections[viewerId]) {
                console.warn(`⚠️ Connection for ${viewerId} already exists, closing old one.`);
                peerConnections[viewerId].close();
                delete peerConnections[viewerId];
            }

            const pc = new RTCPeerConnection(configuration);
            peerConnections[viewerId] = pc;

            // Add tracks to peer connection
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
                console.log(`➕ Added ${track.kind} track to connection ${viewerId}`);
            });

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log(`❄️ Sending ICE candidate to ${viewerId}`);
                    socket.emit('ice-candidate', { target: viewerId, candidate: event.candidate });
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log(`🧊 ICE state with ${viewerId}: ${pc.iceConnectionState}`);
            };

            pc.onconnectionstatechange = () => {
                console.log(`🔗 Connection state with ${viewerId}: ${pc.connectionState}`);
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    delete peerConnections[viewerId];
                    statusDiv.textContent = `Viewer ${viewerId} disconnected`;
                }
            };

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                console.log(`📤 Sending offer to ${viewerId}`);
                socket.emit('offer', { target: viewerId, sdp: pc.localDescription });
            } catch (err) {
                console.error(`❌ Error creating offer for ${viewerId}:`, err);
                statusDiv.textContent = `Error creating offer: ${err.message}`;
            }
        }

        socket.on('answer', async (data) => {
            const pc = peerConnections[data.from];
            if (pc) {
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    statusDiv.textContent = `Viewer ${data.from} connected.`;
                    console.log(`✅ Remote description set for ${data.from}`);
                } catch (err) {
                    console.error(`❌ Error setting remote description for ${data.from}:`, err);
                    statusDiv.textContent = `Connection error with viewer ${data.from}`;
                }
            } else {
                console.warn(`⚠️ Received answer from unknown viewer ${data.from}`);
            }
        });

        socket.on('ice-candidate', async (data) => {
            const pc = peerConnections[data.from];
            if (pc && data.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                    console.log(`❄️ Added ICE candidate from ${data.from}`);
                } catch (err) {
                    console.error(`❌ Error adding ICE candidate from ${data.from}:`, err);
                }
            }
        });

        // Handle viewer disconnections
        socket.on('viewer-disconnected', (viewerId) => {
            if (peerConnections[viewerId]) {
                peerConnections[viewerId].close();
                delete peerConnections[viewerId];
                console.log(`👋 Viewer ${viewerId} disconnected`);
                statusDiv.textContent = `Viewer ${viewerId} left`;
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            endBroadcast();
        });
    </script>
</body>
</html>
