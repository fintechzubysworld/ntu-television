<!DOCTYPE html>
<html>
<head>
    <title>Ntu Television - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📺 Ntu Television Admin</h1>
        <video id="localVideo" autoplay muted playsinline></video>
        <button id="startBtn">Start Broadcast</button>
        <div id="status"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let localStream;
        let peerConnections = {};  // viewerId -> RTCPeerConnection
        let adminId;

        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        startBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.textContent = 'Camera active. Waiting for viewers...';
                socket.emit('admin-ready');
                adminId = socket.id;
            } catch (err) {
                console.error('Error accessing camera:', err);
                statusDiv.textContent = 'Error accessing camera.';
            }
        });

        // A new viewer wants to watch
        socket.on('new-viewer', (viewerId) => {
            statusDiv.textContent = `Viewer ${viewerId} connected. Creating offer...`;
            createPeerConnection(viewerId);
        });

        async function createPeerConnection(viewerId) {
            const pc = new RTCPeerConnection(configuration);
            peerConnections[viewerId] = pc;

            // Add local stream tracks to the connection
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // Handle ICE candidates and send to viewer
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { target: viewerId, candidate: event.candidate });
                }
            };

            // Create and send offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('offer', { target: viewerId, sdp: pc.localDescription });
        }

        // Receive answer from viewer
        socket.on('answer', async (data) => {
            const pc = peerConnections[data.from];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                statusDiv.textContent = `Viewer ${data.from} connected.`;
            }
        });

        // Exchange ICE candidates
        socket.on('ice-candidate', async (data) => {
            const pc = peerConnections[data.from];
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        // Optional: handle viewer disconnection (not implemented for brevity)
    </script>
</body>
</html>
