<!DOCTYPE html>
<html>
<head>
    <title>Ntu Television - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mode-switch">
        <a href="index.html" class="switch-btn">🔁 Switch to Viewer</a>
    </div>
    <div class="container">
        <h1>📺 Ntu Television Admin</h1>
        <video id="localVideo" autoplay muted playsinline></video>
        <button id="startBtn">Start Broadcast</button>
        <div id="status"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // (same JavaScript as before – no changes)
        const socket = io();
        let localStream;
        let peerConnections = {};

        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        startBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = 'Requesting camera access...';
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.textContent = 'Camera active. Waiting for viewers...';
                socket.emit('admin-ready');
                console.log('📡 Admin ready signal sent');
            } catch (err) {
                console.error('❌ Camera error:', err);
                statusDiv.textContent = 'Error accessing camera: ' + err.message;
            }
        });

        socket.on('new-viewer', (viewerId) => {
            statusDiv.textContent = `New viewer ${viewerId} connected. Creating offer...`;
            console.log(`👤 New viewer: ${viewerId}`);
            createPeerConnection(viewerId);
        });

        async function createPeerConnection(viewerId) {
            if (peerConnections[viewerId]) {
                console.warn(`⚠️ Connection for ${viewerId} already exists, closing old one.`);
                peerConnections[viewerId].close();
            }
            const pc = new RTCPeerConnection(configuration);
            peerConnections[viewerId] = pc;

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log(`❄️ Sending ICE candidate to ${viewerId}`);
                    socket.emit('ice-candidate', { target: viewerId, candidate: event.candidate });
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`🔗 Connection state with ${viewerId}: ${pc.connectionState}`);
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    delete peerConnections[viewerId];
                }
            };

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                console.log(`📤 Sending offer to ${viewerId}`);
                socket.emit('offer', { target: viewerId, sdp: pc.localDescription });
            } catch (err) {
                console.error(`❌ Error creating offer for ${viewerId}:`, err);
            }
        }

        socket.on('answer', async (data) => {
            const pc = peerConnections[data.from];
            if (pc) {
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    statusDiv.textContent = `Viewer ${data.from} connected.`;
                    console.log(`✅ Remote description set for ${data.from}`);
                } catch (err) {
                    console.error(`❌ Error setting remote description for ${data.from}:`, err);
                }
            } else {
                console.warn(`⚠️ Received answer from unknown viewer ${data.from}`);
            }
        });

        socket.on('ice-candidate', async (data) => {
            const pc = peerConnections[data.from];
            if (pc && data.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                    console.log(`❄️ Added ICE candidate from ${data.from}`);
                } catch (err) {
                    console.error(`❌ Error adding ICE candidate from ${data.from}:`, err);
                }
            }
        });

        socket.on('broadcast-ended', () => {
            statusDiv.textContent = 'Broadcast ended by admin.';
            for (let id in peerConnections) {
                peerConnections[id].close();
                delete peerConnections[id];
            }
        });
    </script>
</body>
</html>
