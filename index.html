<!DOCTYPE html>
<html>
<head>
    <title>Ntu Television - Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mode-switch">
        <a href="admin.html" class="switch-btn">🔁 Switch to Admin</a>
    </div>
    <div class="container">
        <h1>📺 Ntu Television - Live</h1>
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="status"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // (same JavaScript as before – unchanged)
        const socket = io();
        let peerConnection;
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        statusDiv.textContent = 'Connecting to server...';
        socket.emit('viewer-ready');
        console.log('👀 Viewer ready signal sent');

        socket.on('no-broadcast', () => {
            statusDiv.textContent = 'No broadcast is currently active.';
            console.log('❌ No broadcast');
        });

        socket.on('broadcast-ended', () => {
            statusDiv.textContent = 'The broadcast has ended.';
            console.log('📴 Broadcast ended');
            if (peerConnection) peerConnection.close();
        });

        socket.on('offer', async (data) => {
            statusDiv.textContent = 'Received offer, creating answer...';
            console.log(`📥 Received offer from ${data.from}`);

            if (peerConnection) {
                peerConnection.close();
            }

            peerConnection = new RTCPeerConnection(configuration);

            peerConnection.ontrack = (event) => {
                console.log('🎥 Received track, setting video source');
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log(`❄️ Sending ICE candidate to ${data.from}`);
                    socket.emit('ice-candidate', { target: data.from, candidate: event.candidate });
                }
            };

            peerConnection.onconnectionstatechange = () => {
                console.log(`🔗 Connection state: ${peerConnection.connectionState}`);
            };

            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                console.log(`📤 Sending answer to ${data.from}`);
                socket.emit('answer', { target: data.from, sdp: peerConnection.localDescription });
                statusDiv.textContent = 'Connected, waiting for video...';
            } catch (err) {
                console.error('❌ Error handling offer:', err);
                statusDiv.textContent = 'Error: ' + err.message;
            }
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection && data.candidate) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    console.log(`❄️ Added ICE candidate from ${data.from}`);
                } catch (err) {
                    console.error('❌ Error adding ICE candidate:', err);
                }
            }
        });
    </script>
</body>
</html>
